<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>RAUMWERK</title>
  <meta name="theme-color" content="#7a3624">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="../icon.svg">
  <link rel="stylesheet" href="mobil.css">
  <!-- Brücke zur echten Gerätehardware (Lage/GPS/Kameras). -->
  <script src="../native.js"></script>
</head>
<body>
  <div id="app">
    <header class="kopf">
      <span class="kopf-marke">RW</span>
      <button class="kopf-titel" id="kopfTitel">
        <b id="kopfRaum">Raum</b>
        <small id="kopfProjekt">Projekt</small>
      </button>
      <button class="kopf-menue" id="btnMenue" aria-label="Menü">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </header>

    <main id="screens">
      <section class="screen screen-raeume aktiv" data-screen="raeume">
        <div class="screen-inhalt" id="screenRaeume"></div>
        <button class="fab" id="fabRaum" aria-label="Raum hinzufügen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </section>

      <section class="screen screen-plan" data-screen="plan">
        <div class="plan-kopf">
          <div class="segmente" id="planWerkzeuge">
            <button data-modus="auswahl" class="an">Auswahl</button>
            <button data-modus="messen-strecke">Messen</button>
            <button data-modus="messen-flaeche">Fläche</button>
          </div>
          <button class="plan-rund" id="planEinpassen" aria-label="Einpassen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg>
          </button>
          <button class="plan-rund" id="planAR" aria-label="AR">AR</button>
        </div>
        <div class="plan-flaeche" id="planFlaeche">
          <svg id="planSvg"></svg>
          <div class="plan-toast" id="planToast"></div>
        </div>
        <button class="fab" id="fabPalette" aria-label="Gerät setzen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </section>

      <section class="screen screen-scan" data-screen="scan">
        <div class="screen-inhalt" id="screenScan"></div>
      </section>

      <section class="screen screen-3d" data-screen="3d">
        <div class="plan-kopf">
          <div class="segmente" id="dreidModus">
            <button data-modus="drehen" class="an">Drehen</button>
            <button data-modus="verschieben">Verschieben</button>
            <button data-modus="begehen">Begehen</button>
          </div>
        </div>
        <div class="dreid-flaeche" id="dreidFlaeche"></div>
      </section>

      <section class="screen screen-pruefung" data-screen="pruefung">
        <div class="screen-inhalt" id="screenPruefung"></div>
      </section>
    </main>

    <nav class="tabbar" id="tabbar">
      <button data-ziel="raeume" class="an">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        Räume
      </button>
      <button data-ziel="plan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
        Plan
      </button>
      <button data-ziel="scan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M20 8V5a1 1 0 0 0-1-1h-3M4 16v3a1 1 0 0 0 1 1h3M20 16v3a1 1 0 0 1-1 1h-3"/><circle cx="12" cy="12" r="3"/></svg>
        Scan
      </button>
      <button data-ziel="3d">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 21 7v10l-9 5-9-5V7z"/><path d="M12 12 21 7M12 12v10M12 12 3 7"/></svg>
        3D
      </button>
      <button data-ziel="pruefung">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5c0 4.4 3 8.3 7 10 4-1.7 7-5.6 7-10V6z"/><path d="m9 12 2 2 4-4"/></svg>
        Prüfung
      </button>
    </nav>
  </div>

  <script type="module" src="mobil.js"></script>
</body>
</html>
