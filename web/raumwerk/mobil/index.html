<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>RAUMWERK</title>
  <meta name="theme-color" content="#A8432A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="../icon.svg">
  <link rel="stylesheet" href="mobil.css">
  <!-- Brücke zur echten Gerätehardware (Lage/GPS/Kameras). -->
  <script src="../native.js"></script>
  <script>
    // Dark Mode („Baustelle") früh setzen, damit es nicht aufblitzt.
    try { if (localStorage.getItem("raumwerk.thema") === "dunkel")
      document.documentElement.setAttribute("data-thema", "dunkel"); } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <header class="kopf">
      <div class="kopf-reihe">
        <button class="kopf-burger" id="btnDrawer" aria-label="Menü"><i></i><i></i><i></i></button>
        <button class="kopf-titel" id="kopfTitel">
          <span class="kopf-krume" id="kopfKrume">RAUMWERK · FELD</span>
          <span class="kopf-name" id="kopfName">Projekte</span>
        </button>
        <button class="kopf-sync" id="btnSync">
          <span class="kopf-punkt" id="syncPunkt"></span>
          <span id="syncText">LOKAL</span>
        </button>
      </div>
    </header>

    <main id="screens">
      <section class="screen aktiv" data-screen="projekte">
        <div class="screen-inhalt" id="screenProjekte"></div>
        <button class="fab" id="fabRaum">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Raum
        </button>
      </section>

      <section class="screen screen-plan" data-screen="plan">
        <div class="plan-leiste">
          <div class="segmente" id="planWerkzeuge">
            <button data-modus="auswahl" class="an">Auswahl</button>
            <button data-modus="messen-strecke">Messen</button>
            <button data-modus="messen-flaeche">Fläche</button>
          </div>
          <button class="plan-rund" id="planEinpassen" aria-label="Einpassen">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg>
          </button>
        </div>
        <div class="plan-flaeche" id="planFlaeche">
          <svg id="planSvg"></svg>
          <div class="plan-toast" id="planToast"></div>
        </div>
        <button class="fab" id="fabPalette">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Element
        </button>
      </section>

      <section class="screen" data-screen="scan">
        <div class="screen-inhalt" id="screenScan"></div>
      </section>

      <section class="screen" data-screen="ar">
        <div class="screen-inhalt" id="screenAr"></div>
      </section>

      <section class="screen screen-3d" data-screen="3d">
        <div class="plan-leiste">
          <div class="segmente" id="dreidModus">
            <button data-modus="drehen" class="an">Drehen</button>
            <button data-modus="verschieben">Verschieben</button>
            <button data-modus="begehen">Begehen</button>
          </div>
        </div>
        <div class="dreid-flaeche" id="dreidFlaeche"></div>
      </section>

      <section class="screen" data-screen="pruefung">
        <div class="screen-inhalt" id="screenPruefung"></div>
      </section>

      <section class="screen" data-screen="doku">
        <div class="screen-inhalt" id="screenDoku"></div>
      </section>
    </main>
  </div>

  <script type="module" src="mobil.js"></script>
</body>
</html>
