name: Android APK

# Baut die RAUMWERK-Android-App (Debug-APK) auf einem GitHub-Runner, wo das
# Android-SDK verfügbar ist, und legt die APK als Artefakt ab. Herunterladen
# unter Actions → dieser Lauf → Artefakte → raumwerk-android-debug.
on:
  push:
    paths:
      - "android-app/**"
      - "web/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Debug-APK bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android-SDK einrichten
        uses: android-actions/setup-android@v3

      - name: SDK-Komponenten
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: assembleDebug
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: APK als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: raumwerk-android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Die fertige APK zusätzlich auf den Branch `apk` legen – so lässt sie
      # sich per git (statt nur über die Artefakt-Oberfläche) beziehen.
      - name: APK auf apk-Branch veröffentlichen
        run: |
          set -e
          APK="$GITHUB_WORKSPACE/android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          repo="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          tmp="$RUNNER_TEMP/apkpub"; rm -rf "$tmp"
          if git clone --depth 1 --branch apk "$repo" "$tmp" 2>/dev/null; then
            cd "$tmp"
          else
            git clone --depth 1 "$repo" "$tmp"; cd "$tmp"; git checkout --orphan apk
          fi
          find . -maxdepth 1 ! -name .git ! -name . -exec rm -rf {} +
          cp "$APK" raumwerk-ziegel.apk
          printf 'RAUMWERK Android (Ziegel-Design)\nCommit: %s\nGebaut: %s UTC\n' "$GITHUB_SHA" "$(date -u '+%Y-%m-%d %H:%M')" > BUILD.txt
          git add -A
          git -c user.name=raumwerk-ci -c user.email=ci@raumwerk commit -m "APK ${GITHUB_SHA::7}"
          git push -f "$repo" HEAD:apk
